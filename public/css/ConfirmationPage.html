<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Booking Confirmed</title>
  <style>
    :root {
      --green: #2e7d32;
      --green-dark: #1b5e20;
      --gold: #d4af37;
      --white: #ffffff;
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background-color: var(--green-dark);
      color: var(--white);
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }

    .container {
      max-width: 600px;
      padding: 40px 20px;
      background-color: var(--white);
      color: var(--green-dark);
      border: 3px solid var(--gold);
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }

    .logo {
      width: 120px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 2.2rem;
      margin-bottom: 10px;
      color: var(--green);
    }

    p {
      font-size: 1.1rem;
      color: #333;
      margin: 10px 0;
    }

    .highlight {
      color: var(--gold);
      font-weight: bold;
    }

    .button {
      display: inline-block;
      margin-top: 30px;
      padding: 12px 24px;
      font-size: 1rem;
      color: var(--white);
      background-color: var(--green);
      border: none;
      border-radius: 8px;
      text-decoration: none;
      transition: background-color 0.3s ease;
    }

    .button:hover {
      background-color: #256a26;
    }
  </style>
</head>

  </div>
</body>
</html>
